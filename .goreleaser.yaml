version: 2

builds:
  - id: roadie
    main: .
    binary: roadie
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X roadie/internal/buildinfo.Version={{ .Version }}

archives:
  - id: roadie
    formats: [binary]
    name_template: "roadie_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  use: git

release:
  github:
    owner: adamcarlile
    name: roadie
